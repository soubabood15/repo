<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Live Team Schedule</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root{--bg:#11151d;--surface:#1b202a;--surface2:#222834;--line:#343b48;--text:#eef1f7;--muted:#9299a8;--blue:#4568f6;--teal:#49c8b7;--red:#ef6a62;--amber:#f0ad5e}*{box-sizing:border-box}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif}.shell{width:min(1540px,calc(100% - 32px));margin:auto;padding:24px 0 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px;padding:17px 19px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.brand{display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),#26a6bb);font-weight:900}.brand h1{margin:0;font-size:20px}.brand p{margin:5px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;align-items:center;gap:8px}.btn{min-height:39px;padding:0 13px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:var(--surface2);font:inherit;font-size:11px;font-weight:750;cursor:pointer}.btn:hover{border-color:#596274}.btn.primary{border-color:var(--blue);background:var(--blue)}.live{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;color:#8fe1d6;background:#1f3836;font-size:10px;font-weight:800}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px rgba(73,200,183,.1);animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(73,200,183,0)}}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;margin-bottom:14px}.control{height:43px;padding:0 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--surface);font:inherit;font-size:11px;outline:none}.control:focus{border-color:var(--blue)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}.metric span,.metric strong{display:block}.metric span{color:var(--muted);font-size:9px}.metric strong{margin-top:7px;font-size:22px}.metric.teal strong{color:var(--teal)}.table-card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.table-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 18px;border-bottom:1px solid var(--line)}.table-head strong{font-size:14px}.table-head small{display:block;margin-top:4px;color:var(--muted);font-size:9px}.table-wrap{overflow:auto;scrollbar-width:none}.table-wrap::-webkit-scrollbar{display:none}.schedule{width:100%;min-width:1260px;border-collapse:collapse;direction:rtl}.schedule th,.schedule td{padding:11px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;font-size:10px}.schedule th{position:sticky;top:0;z-index:2;color:#aeb4c1;background:#202631;font-size:9px}.schedule th:first-child,.schedule td:first-child{position:sticky;right:0;z-index:3;width:190px;text-align:right;background:#1d232d}.schedule th:first-child{z-index:4;background:#202631}.schedule tbody tr:hover td{background:#242b37}.schedule tbody tr:hover td:first-child{background:#29313e}.person strong,.person small{display:block}.person strong{font-size:11px}.person small{margin-top:4px;color:var(--muted);font-size:8px}.shift{display:inline-flex;min-width:66px;min-height:30px;align-items:center;justify-content:center;padding:4px 7px;border:1px solid #3e4d63;border-radius:8px;color:#bdd0ed;background:#243043;font-weight:750}.shift.off{color:#f38a82;border-color:#593e40;background:#33272a}.shift.today{color:#fff;border-color:var(--blue);background:#334ca9}.empty{padding:55px 20px;color:var(--muted);text-align:center}.error{color:#ff9b94}.updated{color:var(--muted);font-size:9px}.day-date{display:block;margin-top:4px;color:#727b8a;font-size:8px}.today-head{color:#9fb0ff!important;background:#29345a!important}@media(max-width:800px){.shell{width:min(100% - 18px,1540px);padding-top:10px}.topbar{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-wrap:wrap}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.schedule th:first-child,.schedule td:first-child{width:145px}.brand h1{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    .schedule{direction:ltr}.schedule th:first-child,.schedule td:first-child{left:0;right:auto;text-align:left}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="mark">N</div><div><h1>Live Team Schedule</h1><p>The same Admin and eBook schedule — updated automatically</p></div></div><div class="actions"><span class="live" id="liveStatus">Live Connected</span><button class="btn" id="backBtn" type="button">Back</button><button class="btn primary" id="refreshBtn" type="button">Refresh Now</button></div></header>
    <section class="toolbar"><input class="control" id="searchInput" type="search" placeholder="Search by employee name or username"><button class="btn" id="prevWeek" type="button">Previous Week</button><button class="btn" id="nextWeek" type="button">Next Week</button></section>
    <section class="summary"><div class="metric"><span>Total Employees</span><strong id="employeeCount">0</strong></div><div class="metric teal"><span>Working Today</span><strong id="workingCount">0</strong></div><div class="metric"><span>Off Today</span><strong id="offCount">0</strong></div><div class="metric"><span>Week Starts</span><strong id="weekValue">--</strong></div></section>
    <section class="table-card"><div class="table-head"><div><strong>All Employee Schedules</strong><small>14 days: current week and next week</small></div><span class="updated" id="updatedAt">Loading...</span></div><div class="table-wrap" id="tableWrap"><div class="empty">Loading team schedules...</div></div></section>
  </main>
  <script>
    "use strict";
    if(!localStorage.getItem("ebookUser")&&!localStorage.getItem("newtel-admin-auth"))location.replace("ebook.html");
    const SUPABASE_URL="https://estyiinuotsygtrgtezz.supabase.co",SUPABASE_ANON_KEY="sb_publishable_NB_aYGgJ7o8RB1ddYWSIOA_Gwj39mfs";
    const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}}),$=id=>document.getElementById(id);
    const state={users:[],controls:[],weekOffset:0,query:"",loading:false};
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const iso=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],dayKeys=["sun","mon","tue","wed","thu","fri","sat"];
    function dates(){const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(now.getDate()-now.getDay()+state.weekOffset*7);return Array.from({length:14},(_,index)=>{const date=new Date(start);date.setDate(start.getDate()+index);return {date,key:dayKeys[date.getDay()],label:dayNames[date.getDay()],iso:iso(date)}})}
    function controlValue(key){return String(state.controls.find(row=>String(row.key).toLowerCase()===String(key).toLowerCase())?.value||"")}
    function shiftFor(username,day){return controlValue(`shift_${username}_${day.iso}`)||controlValue(`shift_${username}_${day.key}`)||"OFF"}
    function isOff(value){return !value||/^(off|not assigned)$/i.test(String(value).trim())}
    function render(){const days=dates(),today=iso(new Date()),query=state.query.trim().toLowerCase(),users=state.users.filter(user=>!query||`${user.full_name||""} ${user.username||""}`.toLowerCase().includes(query));let working=0,off=0;const todayDay=days.find(day=>day.iso===today);if(todayDay)users.forEach(user=>isOff(shiftFor(user.username,todayDay))?off++:working++);$("employeeCount").textContent=users.length;$("workingCount").textContent=working;$("offCount").textContent=off;$("weekValue").textContent=days[0].iso;const head=days.map(day=>`<th class="${day.iso===today?"today-head":""}">${day.label}<span class="day-date">${day.iso.slice(5)}</span></th>`).join("");const body=users.map(user=>`<tr><td><div class="person"><strong>${esc(user.full_name||user.username)}</strong><small>${esc(user.username)}</small></div></td>${days.map(day=>{const value=shiftFor(user.username,day),classes=`shift ${isOff(value)?"off":""} ${day.iso===today?"today":""}`;return `<td><span class="${classes}">${esc(isOff(value)?"OFF":value)}</span></td>`}).join("")}</tr>`).join("");$("tableWrap").innerHTML=users.length?`<table class="schedule"><thead><tr><th>Employee</th>${head}</tr></thead><tbody>${body}</tbody></table>`:'<div class="empty">No matching employees found.</div>'}
    async function load(){if(state.loading)return;state.loading=true;$("refreshBtn").disabled=true;try{const [usersResult,controlsResult]=await Promise.all([client.from("trainer_users").select("full_name,username,role,active").eq("active",true).neq("role","admin").order("full_name"),client.from("app_control").select("key,value,updated_at").like("key","shift_%")]);if(usersResult.error)throw usersResult.error;if(controlsResult.error)throw controlsResult.error;state.users=usersResult.data||[];state.controls=controlsResult.data||[];render();$("updatedAt").textContent=`Last updated: ${new Date().toLocaleTimeString("en-GB")}`;$("liveStatus").textContent="Live Connected";$("liveStatus").classList.remove("error")}catch(error){$("tableWrap").innerHTML=`<div class="empty error">Could not load schedules: ${esc(error.message)}</div>`;$("liveStatus").textContent="Reconnecting";$("liveStatus").classList.add("error")}finally{state.loading=false;$("refreshBtn").disabled=false}}
    $("searchInput").addEventListener("input",event=>{state.query=event.target.value;render()});$("prevWeek").addEventListener("click",()=>{state.weekOffset--;render()});$("nextWeek").addEventListener("click",()=>{state.weekOffset++;render()});$("refreshBtn").addEventListener("click",load);$("backBtn").addEventListener("click",()=>history.length>1?history.back():location.assign("ebook.html"));
    let refreshTimer;const refreshSoon=()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(load,250)};client.channel("team-schedule-live").on("postgres_changes",{event:"*",schema:"public",table:"app_control"},refreshSoon).on("postgres_changes",{event:"*",schema:"public",table:"trainer_users"},refreshSoon).subscribe(status=>{$("liveStatus").textContent=status==="SUBSCRIBED"?"Live Connected":"Connecting"});setInterval(load,15000);load();
  </script>
</body>
</html>
