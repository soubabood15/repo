/* Compact KORVIX signature */
.corvex-badge{margin-right:auto;display:flex;align-items:center;gap:10px;padding:0 0 0 18px;border:0;border-left:1px solid rgba(29,29,31,.12);border-radius:0;background:transparent;box-shadow:none}

.corvex-badge i:after{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:3px}
.corvex-badge div{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.corvex-badge span{font-size:8px;color:#86868b}
