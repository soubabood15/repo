function qualityCdrTime(value,offsetSeconds=0){const date=new Date(value);return Number.isNaN(date.getTime())?'Unknown time':qualityExactTime(new Date(date.getTime()+offsetSeconds*1000))}
function qualityCallCard(r){
  const hasAudio=Boolean(r.audio_path),media=hasAudio?`<div class="player"><audio controlsList="nodownload noplaybackrate noremoteplayback" disableRemotePlayback preload="metadata" data-audio data-path="${esc(r.audio_path)}" oncontextmenu="return false"></audio><div class="custom-player"><div class="custom-player-main"><button class="play-toggle" data-play type="button">▶</button><div class="player-copy"><small>SECURE CALL PLAYER</small><strong>${esc(r.title)}</strong></div></div><div class="progress-wrap"><input class="progress-slider" data-progress type="range" min="0" max="100" step=".1" value="0"><div class="time-row"><span data-current>0:00</span><span data-duration>0:00</span></div></div></div><div class="speed-control"><div class="speed-control-head"><span>Playback speed</span><strong class="speed-value" data-speed-value>1×</strong></div><input class="speed-slider" data-speed-slider type="range" min="1" max="4" step=".25" value="1"></div></div>`:`<div class="call-reference"><div><small>GRANDSTREAM UCM · CDR FILTER</small><strong>Extension ${esc(r.agent_extension||'—')}</strong><span>Start Time: ${esc(qualityCdrTime(r.call_started_at,-60))}<br>End Time: ${esc(qualityCdrTime(r.ended_at,60))}<br>Call Type: Inbound Calls · Status: Answered<br>Expected Talk Time: ${esc(formatAudioTime(Number(r.talk_seconds||0)))} · Queue: ${esc(r.queue_name||'—')}</span></div></div>`;
  return `<article class="call" data-id="${r.id}"><div class="call-head"><div><span class="call-agent">${esc(r.agent_name||r.agent_username||'Unassigned')}</span><h3>${esc(r.title||`Call ID ${r.source_call_id}`)}</h3><small>${esc(qualityDayLabel(qualityCallDate(r)))} · ${hasAudio?esc(r.audio_name||'Audio call'):'KPI selected Call ID'}</small></div><span class="status ${r.status==='evaluated'?'done':''}">${r.status==='evaluated'?`${esc(r.score)}/100`:'Pending'}</span></div><div class="call-body">${media}<div class="evaluation"><div class="score-wrap"><input data-score type="number" min="0" max="100" value="${r.score??''}" placeholder="0"><strong>/ 100</strong></div><textarea data-notes placeholder="Write the Quality evaluation notes...">${esc(r.notes||'')}</textarea><button class="btn save" data-save>Save evaluation</button><small>${r.evaluated_by?`✓ Evaluated by ${esc(r.evaluated_by)} · ${new Date(r.evaluated_at).toLocaleString()}`:'Not evaluated yet'}</small></div></div></article>`
}
async function render(){
  renderEmployeeSummaries();const filter=$('filter').value,agent=$('agentFilter').value;let list=filter==='all'?rows:rows.filter(r=>r.status===filter);if(agent!=='all')list=list.filter(r=>r.agent_username===agent);$('summary').textContent=`${list.length} call${list.length===1?'':'s'}`;if(!list.length){$('calls').innerHTML='<div class="empty">No calls in this view.</div>';return}
  const days=new Map();list.forEach(row=>{const day=qualityCallDate(row);if(!days.has(day))days.set(day,[]);days.get(day).push(row)});$('calls').innerHTML=[...days.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([day,dayRows],dayIndex)=>{const agents=new Map();dayRows.forEach(row=>{const key=row.agent_username||'unassigned';if(!agents.has(key))agents.set(key,[]);agents.get(key).push(row)});const done=dayRows.filter(row=>row.status==='evaluated').length;return `<section class="quality-day"><button class="quality-day-toggle" type="button"><span>${esc(qualityDayLabel(day))}</span><small>${dayRows.length} calls · ✓ ${done} evaluated</small></button><div class="quality-day-content" ${dayIndex?'hidden':''}>${[...agents.values()].map(agentRows=>`<div class="quality-agent-group"><div class="quality-agent-title"><span>${esc(agentRows[0].agent_name||agentRows[0].agent_username||'Unassigned')}</span><span>${agentRows.length} calls</span></div>${agentRows.map(qualityCallCard).join('')}</div>`).join('')}</div></section>`}).join('');
  document.querySelectorAll('.quality-day-toggle').forEach(button=>button.onclick=()=>{const content=button.nextElementSibling;content.hidden=!content.hidden});
  for(const card of document.querySelectorAll('.call')){card.querySelector('[data-save]').onclick=()=>saveEvaluation(card);const audio=card.querySelector('audio');if(!audio)continue;const play=card.querySelector('[data-play]'),progress=card.querySelector('[data-progress]'),current=card.querySelector('[data-current]'),duration=card.querySelector('[data-duration]'),speed=card.querySelector('[data-speed-slider]'),speedValue=card.querySelector('[data-speed-value]');audio.src=await audioUrl(audio.dataset.path);play.onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.onloadedmetadata=()=>duration.textContent=formatAudioTime(audio.duration);audio.ontimeupdate=()=>{current.textContent=formatAudioTime(audio.currentTime);progress.value=audio.duration?audio.currentTime/audio.duration*100:0};progress.oninput=()=>{if(audio.duration)audio.currentTime=Number(progress.value)/100*audio.duration};speed.oninput=()=>{audio.playbackRate=Number(speed.value);speedValue.textContent=`${speed.value}×`}}
}
async function requestQualityAccess(){
  const username=$('email').value.trim().toLowerCase(),button=$('loginBtn');if(!username)return $('loginError').textContent='Enter your username.';
  const token=crypto.randomUUID();accessDb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false},global:{headers:{'x-quality-token':token}}});
  button.disabled=true;button.textContent='Sending request...';$('loginError').textContent='';
  const {data,error}=await accessDb.from('quality_access_requests').insert({username,request_token:token,status:'pending'}).select().single();
  if(error){button.disabled=false;button.textContent='Request access';$('loginError').textContent=error.message;return}
  qualityRequest=data;localStorage.setItem('newtel-quality-request',JSON.stringify({token,username}));$('qualityBootStatus').textContent='Request sent · Waiting for Admin approval';button.textContent='Waiting for approval...';startQualityAccessPolling();
}
function restoreQualityRequest(){try{const saved=JSON.parse(localStorage.getItem('newtel-quality-request')||'null');if(!saved?.token)return false;$('email').value=saved.username||'';accessDb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false},global:{headers:{'x-quality-token':saved.token}}});$('loginBtn').disabled=true;$('loginBtn').textContent='Checking request...';startQualityAccessPolling();return true}catch{return false}}
function startQualityAccessPolling(){clearInterval(qualityAccessTimer);checkQualityAccess();qualityAccessTimer=setInterval(checkQualityAccess,3000)}
async function checkQualityAccess(){
  if(!accessDb)return;const {data,error}=await accessDb.from('quality_access_requests').select('*').maybeSingle();if(error)return $('loginError').textContent=error.message;if(!data)return;
  qualityRequest=data;
  if(data.status==='approved'&&new Date(data.expires_at).getTime()>Date.now()){
    if(qualitySessionEntered)return;
    qualitySessionEntered=true;clearInterval(qualityAccessTimer);profile={username:data.username,full_name:data.username,role:'quality'};$('login').style.display='none';$('app').style.display='block';startQualityPresence();await loadCalls();return
  }
  if(data.status==='approved')data.status='revoked';
  if(data.status==='rejected'||data.status==='revoked'){qualitySessionEntered=false;clearInterval(qualityAccessTimer);stopQualityPresence();document.querySelectorAll('audio').forEach(audio=>audio.pause());localStorage.removeItem('newtel-quality-request');$('app').style.display='none';$('login').style.display='grid';$('loginBtn').disabled=false;$('loginBtn').textContent='Request access';$('loginError').textContent=data.status==='revoked'?'Admin ended your Quality session.':'Your access request was rejected.';$('qualityBootStatus').textContent='Admin approval is required · No password'}
  else $('qualityBootStatus').textContent='Request sent · Waiting for Admin approval';
}
function qualityActivityState(){if(qualityPlayingCall)return'listening';if(document.hidden)return'background';return Date.now()-qualityLastActivity>60000?'idle':'active'}
async function sendQualityPresence(){if(!accessDb||!qualityRequest||qualityRequest.status!=='approved')return;const now=new Date().toISOString();const {error}=await accessDb.from('quality_presence').upsert({request_id:qualityRequest.id,username:qualityRequest.username,activity_state:qualityActivityState(),current_call:qualityPlayingCall||null,page_visible:!document.hidden,last_activity_at:new Date(qualityLastActivity).toISOString(),last_seen_at:now,user_agent:navigator.userAgent},{onConflict:'request_id'});if(error&&/approved|policy|permission/i.test(error.message||''))checkQualityAccess()}
function startQualityPresence(){clearInterval(qualityPresenceTimer);sendQualityPresence();qualityPresenceTimer=setInterval(()=>{sendQualityPresence();checkQualityAccess()},5000)}
function stopQualityPresence(){clearInterval(qualityPresenceTimer);qualityPresenceTimer=null}
['click','keydown','input','mousemove','touchstart'].forEach(type=>document.addEventListener(type,()=>qualityLastActivity=Date.now(),{passive:true}));document.addEventListener('visibilitychange',sendQualityPresence);document.addEventListener('play',event=>{if(event.target.matches('audio')){qualityPlayingCall=event.target.closest('.call')?.querySelector('h3')?.textContent||'Call audio';sendQualityPresence()}},true);document.addEventListener('pause',event=>{if(event.target.matches('audio')){qualityPlayingCall='';sendQualityPresence()}},true);
async function saveEvaluation(card){const score=Number(card.querySelector('[data-score]').value),notes=card.querySelector('[data-notes]').value.trim(),button=card.querySelector('[data-save]');if(!Number.isFinite(score)||score<0||score>100){$('msg').textContent='Score must be between 0 and 100.';return}button.disabled=true;button.textContent='Saving...';const {error}=await qualityDb().from('quality_calls').update({score,notes,status:'evaluated',evaluated_by:profile.full_name||profile.username,evaluated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',card.dataset.id);button.disabled=false;button.textContent='Save evaluation';if(error){$('msg').textContent=error.message;return}$('msg').textContent='Evaluation saved successfully.';loadCalls()}
$('logoutBtn').onclick=async()=>{if(qualityRequest&&accessDb)await accessDb.from('quality_access_requests').update({status:'revoked'}).eq('id',qualityRequest.id);localStorage.removeItem('newtel-quality-request');await db.auth.signOut();location.reload()};$('refreshBtn').onclick=loadCalls;$('filter').onchange=render;$('agentFilter').onchange=render;if(!restoreQualityRequest())$('qualityBootStatus').textContent='Admin approval is required · No password';
</script></body></html>
