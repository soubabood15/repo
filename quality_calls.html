function qualityCallDate(row){return String(row.call_date||row.created_at||'').slice(0,10)||'Unknown date'}

function qualityCriteria(r){
  const detailed=['greeting_score','problem_resolution_score','answer_accuracy_score','friendly_closing_score'].some(key=>r[key]!=null);
  return {greeting:detailed?Number(r.greeting_score||0):0,resolution:detailed?Number(r.problem_resolution_score||0):0,accuracy:detailed?Number(r.answer_accuracy_score||0):0,closing:detailed?Number(r.friendly_closing_score||0):0,detailed};
}
function qualityCriteriaMarkup(r){const c=qualityCriteria(r),legacy=!c.detailed&&r.score!=null?Number(r.score):0;return `<div class="criteria"><div class="criterion"><label>Greeting</label><input data-criterion="greeting" type="number" min="0" max="10" step="1" value="${c.greeting}"><span>/ 10</span></div><div class="criterion"><label>Problem resolution</label><input data-criterion="resolution" type="number" min="0" max="40" step="1" value="${c.resolution}"><span>/ 40</span></div><div class="criterion"><label>Answer accuracy</label><input data-criterion="accuracy" type="number" min="0" max="40" step="1" value="${c.accuracy}"><span>/ 40</span></div><div class="criterion"><label>Friendly call closing</label><input data-criterion="closing" type="number" min="0" max="10" step="1" value="${c.closing}"><span>/ 10</span></div></div><div class="score-wrap"><input data-score type="number" value="${c.detailed?c.greeting+c.resolution+c.accuracy+c.closing:legacy}" readonly><strong>/ 100</strong></div>`}
function qualityCriterionValue(input){const max=Number(input.max||0),value=Number(input.value);return Number.isFinite(value)?Math.min(max,Math.max(0,value)):0}

  document.querySelectorAll('.quality-day-toggle').forEach(button=>button.onclick=()=>{const content=button.nextElementSibling;if(button.disabled)return;button.disabled=true;const opening=content.hidden;if(opening)content.hidden=false;qualityAnimate(content,opening?[{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'translateY(0)'}]:[{opacity:1},{opacity:0}],{duration:160}).then(()=>{if(!opening)content.hidden=true;button.disabled=false})});
  if(qualityAddedId){document.querySelectorAll('.call').forEach(card=>{if(card.dataset.id===String(qualityAddedId)){card.classList.add('call-added');const content=card.closest('.quality-day-content');if(content)content.hidden=false;card.scrollIntoView?.({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'})}});qualityAddedId=null}
  for(const card of document.querySelectorAll('.call')){bindQualityCriteria(card);bindQualityUcm(card);const projectSelect=card.querySelector('[data-call-project]');if(projectSelect)projectSelect.onchange=()=>changeQualityCallProject(card);const finishButton=card.querySelector('[data-finish]');if(finishButton)finishButton.onclick=()=>finishQualityAgent(card);const deleteButton=card.querySelector('[data-delete]');if(deleteButton)deleteButton.onclick=()=>deleteQualityEvaluation(card);card.querySelector('[data-save]').onclick=()=>saveEvaluation(card);const audio=card.querySelector('audio');if(!audio)continue;const play=card.querySelector('[data-play]'),progress=card.querySelector('[data-progress]'),current=card.querySelector('[data-current]'),duration=card.querySelector('[data-duration]'),speed=card.querySelector('[data-speed-slider]'),speedValue=card.querySelector('[data-speed-value]');play.onclick=async()=>{if(audio.paused){if(!audio.src){play.disabled=true;const url=await audioUrl(audio.dataset.path);play.disabled=false;if(!url){$('msg').textContent='Could not open this audio file.';return}audio.src=url}document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()});audio.play()}else audio.pause()};audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.onloadedmetadata=()=>duration.textContent=formatAudioTime(audio.duration);audio.ontimeupdate=()=>{current.textContent=formatAudioTime(audio.currentTime);progress.value=audio.duration?audio.currentTime/audio.duration*100:0};progress.oninput=()=>{if(audio.duration)audio.currentTime=Number(progress.value)/100*audio.duration};speed.oninput=()=>{audio.playbackRate=Number(speed.value);speedValue.textContent=`${speed.value}×`}}
}
async function requestQualityAccess(){
  const username=$('email').value.trim().toLowerCase(),button=$('loginBtn');if(!username)return $('loginError').textContent='Enter your username.';
  const token=crypto.randomUUID();accessDb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false},global:{headers:{'x-quality-token':token}}});
  button.disabled=true;button.textContent='Sending request...';$('loginError').textContent='';
  const {data,error}=await accessDb.from('quality_access_requests').insert({username,request_token:token,status:'pending'}).select().single();
  if(error){button.disabled=false;button.textContent='Request access';$('loginError').textContent=error.message;return}
  qualityRequest=data;localStorage.setItem('newtel-quality-request',JSON.stringify({token,username}));$('qualityBootStatus').textContent='Request sent · Waiting for Admin approval';button.textContent='Waiting for approval...';startQualityAccessPolling();
}
function restoreQualityRequest(){try{const saved=JSON.parse(localStorage.getItem('newtel-quality-request')||'null');if(!saved?.token)return false;$('email').value=saved.username||'';accessDb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false},global:{headers:{'x-quality-token':saved.token}}});$('loginBtn').disabled=true;$('loginBtn').textContent='Checking request...';startQualityAccessPolling();return true}catch{return false}}
function startQualityAccessPolling(){clearInterval(qualityAccessTimer);checkQualityAccess();qualityAccessTimer=setInterval(()=>{if(!document.hidden)checkQualityAccess()},10000)}
async function checkQualityAccess(){
  if(!accessDb)return;const {data,error}=await accessDb.from('quality_access_requests').select('*').maybeSingle();if(error)return $('loginError').textContent=error.message;if(!data)return;
  qualityRequest=data;
  if(data.status==='approved'&&new Date(data.expires_at).getTime()>Date.now()){
    if(qualitySessionEntered)return;
    qualitySessionEntered=true;clearInterval(qualityAccessTimer);profile={username:data.username,full_name:data.username,role:'quality'};$('login').style.display='none';$('app').style.display='block';startQualityPresence();await loadCalls();return
  }
  if(data.status==='approved')data.status='revoked';
  if(data.status==='rejected'||data.status==='revoked'){qualitySessionEntered=false;clearInterval(qualityAccessTimer);stopQualityPresence();document.querySelectorAll('audio').forEach(audio=>audio.pause());localStorage.removeItem('newtel-quality-request');$('app').style.display='none';$('login').style.display='grid';$('loginBtn').disabled=false;$('loginBtn').textContent='Request access';$('loginError').textContent=data.status==='revoked'?'Admin ended your Quality session.':'Your access request was rejected.';$('qualityBootStatus').textContent='Admin approval is required · No password'}
  else $('qualityBootStatus').textContent='Request sent · Waiting for Admin approval';
}
function qualityActivityState(){if(qualityPlayingCall)return'listening';if(document.hidden)return'background';return Date.now()-qualityLastActivity>60000?'idle':'active'}
async function sendQualityPresence(){if(!accessDb||!qualityRequest||qualityRequest.status!=='approved')return;const now=new Date().toISOString();const {error}=await accessDb.from('quality_presence').upsert({request_id:qualityRequest.id,username:qualityRequest.username,activity_state:qualityActivityState(),current_call:qualityPlayingCall||null,page_visible:!document.hidden,last_activity_at:new Date(qualityLastActivity).toISOString(),last_seen_at:now,user_agent:navigator.userAgent},{onConflict:'request_id'});if(error&&/approved|policy|permission/i.test(error.message||''))checkQualityAccess()}
function startQualityPresence(){clearInterval(qualityPresenceTimer);sendQualityPresence();qualityPresenceTimer=setInterval(()=>{if(!document.hidden){sendQualityPresence();checkQualityAccess()}},2*60*1000)}
function stopQualityPresence(){clearInterval(qualityPresenceTimer);qualityPresenceTimer=null}
['click','keydown','input','mousemove','touchstart'].forEach(type=>document.addEventListener(type,()=>qualityLastActivity=Date.now(),{passive:true}));document.addEventListener('visibilitychange',sendQualityPresence);document.addEventListener('play',event=>{if(event.target.matches('audio')){qualityPlayingCall=event.target.closest('.call')?.querySelector('h3')?.textContent||'Call audio';sendQualityPresence()}},true);document.addEventListener('pause',event=>{if(event.target.matches('audio')){qualityPlayingCall='';sendQualityPresence()}},true);
function qualityNextTitle(title){const match=String(title||'Call 1').match(/^(.*?)(\d+)\s*$/);return match?`${match[1]}${Number(match[2])+1}`:`${title||'Call'} 2`}
function qualitySameBatch(a,b){return a.agent_username===b.agent_username&&qualityCallDate(a)===qualityCallDate(b)&&a.source_type==='manual_reference'}
async function changeQualityCallProject(card){
  const row=rows.find(row=>String(row.id)===card.dataset.id),select=card.querySelector('[data-call-project]');
  if(!row||!Object.hasOwn(qualityProjects,select.value))return;
  select.disabled=true;
  try{const {error}=await qualityDb().from('quality_calls').update({project_id:select.value,updated_at:new Date().toISOString()}).eq('id',row.id);if(error)throw error;row.project_id=select.value;card.querySelector('.call-project').textContent=qualityProjects[select.value]}
  catch(error){select.value=row.project_id||'';$('msg').textContent=error.message||'Could not change project.'}
  finally{select.disabled=false}
}
async function finishQualityAgent(card){
  const row=rows.find(row=>String(row.id)===card.dataset.id);if(!row)return;
  const buttons=card.closest('.quality-agent-group').querySelectorAll('button');buttons.forEach(button=>button.disabled=true);
  try{
    const {data,error}=await qualityDb().from('quality_calls').select('*').eq('agent_username',row.agent_username).eq('call_date',qualityCallDate(row)).eq('source_type','manual_reference').eq('status','pending');if(error)throw error;
    for(const pending of data||[]){const {error}=await qualityDb().from('quality_calls').delete().eq('id',pending.id).eq('source_type','manual_reference').eq('status','pending');if(error)throw error}
    await qualityAnimate(card,[{opacity:1},{opacity:0,transform:'scale(.97)'}]);
    $('msg').textContent='Finished evaluating this agent. Unused pending calls removed.';qualityScoresNotify?.postMessage({event:'evaluation-deleted'});await loadCalls();
  }catch(error){$('msg').textContent=error.message||'Could not finish evaluations.';await loadCalls()}
  finally{buttons.forEach(button=>button.disabled=false)}
}
async function saveEvaluation(card){
  const row=rows.find(row=>String(row.id)===card.dataset.id),button=card.querySelector('[data-save]');if(button.disabled)return;
  const fields={greeting_score:qualityCriterionValue(card.querySelector('[data-criterion="greeting"]')),problem_resolution_score:qualityCriterionValue(card.querySelector('[data-criterion="resolution"]')),answer_accuracy_score:qualityCriterionValue(card.querySelector('[data-criterion="accuracy"]')),friendly_closing_score:qualityCriterionValue(card.querySelector('[data-criterion="closing"]'))};
  const score=Object.values(fields).reduce((sum,value)=>sum+value,0),notes=card.querySelector('[data-notes]').value.trim();card.querySelector('[data-score]').value=score;button.disabled=true;button.textContent='Saving...';
  let saved=false;
  try{
    const {error}=await qualityDb().from('quality_calls').update({...fields,score,notes,status:'evaluated',evaluated_by:profile.full_name||profile.username,evaluated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',card.dataset.id);if(error)throw error;
    const needsNext=row?.source_type==='manual_reference'&&row.status==='pending';if(row)row.status='evaluated';saved=true;
    if(needsNext){
      const {data:pending,error}=await qualityDb().from('quality_calls').select('id').eq('agent_username',row.agent_username).eq('call_date',qualityCallDate(row)).eq('source_type','manual_reference').eq('status','pending');if(error)throw error;
      if(!pending?.length){const {data:added,error}=await qualityDb().from('quality_calls').insert({title:qualityNextTitle(row.title),project_id:row.project_id||null,call_date:qualityCallDate(row),agent_username:row.agent_username,agent_name:row.agent_name,source_type:'manual_reference',status:'pending',uploaded_by:profile.full_name||profile.username}).select('id');if(error)throw error;qualityAddedId=added?.[0]?.id;$('filter').value='all'}
    }
    $('msg').textContent='Evaluation saved. Use “Finished evaluating this agent” on the next card when done.';
  }catch(error){$('msg').textContent=(saved?'Evaluation saved, but the next call could not be added: ':'')+(error.message||'Could not save evaluation.')}
  finally{button.disabled=false;button.textContent='Save evaluation';if(saved){qualityScoresNotify?.postMessage({event:'evaluation-saved'});await loadCalls()}}
}
function confirmQualityDelete(title){
  const dialog=$('deleteCallDialog');
  if(dialog.open)return Promise.resolve(false);
  $('deleteCallMessage').textContent=`Delete call "${title}" and its evaluation?`;
  dialog.returnValue='cancel';
  return new Promise(resolve=>{dialog.addEventListener('close',()=>resolve(dialog.returnValue==='delete'),{once:true});dialog.showModal()});
}
async function deleteQualityEvaluation(card){
  const row=rows.find(row=>String(row.id)===card.dataset.id);
  if(!row||row.source_type!=='manual_reference'||!(await confirmQualityDelete(row.title)))return;
  const button=card.querySelector('[data-delete]');button.disabled=true;
  try{const {error}=await qualityDb().from('quality_calls').delete().eq('id',row.id).eq('source_type','manual_reference');if(error)throw error;card.querySelector('audio')?.pause();await qualityAnimate(card,[{opacity:1,transform:'scale(1)',maxHeight:card.offsetHeight+'px'},{opacity:0,transform:'scale(.97)',maxHeight:'0px'}],{duration:240});$('msg').textContent='Call deleted.';qualityScoresNotify?.postMessage({event:'evaluation-deleted'});await loadCalls()}
  catch(error){$('msg').textContent=error.message||'Could not delete call.'}
  finally{button.disabled=false}
}
async function addQualityEvaluation(event){event.preventDefault();const project=$('newEvaluationProject').value,title=$('newEvaluationTitle').value.trim(),callDate=$('newEvaluationDate').value,username=$('newEvaluationAgent').value,button=$('addEvaluationBtn');if(!title||!Object.hasOwn(qualityProjects,project)||!callDate||!username){$('msg').textContent='Enter a call name and select a project, employee and call date.';return}const agent=qualityAgents.find(user=>user.username===username),fallback=rows.find(row=>row.agent_username===username),agentName=agent?.full_name||fallback?.agent_name||username;button.disabled=true;button.textContent='Adding...';const payload={project_id:project,title,call_date:callDate,agent_username:username,agent_name:agentName,audio_path:null,audio_name:null,audio_size:null,source_type:'manual_reference',uploaded_by:profile.full_name||profile.username||'quality'};const {data:added,error}=await qualityDb().from('quality_calls').insert(payload).select('id');button.disabled=false;button.textContent='Add evaluation';if(error){$('msg').textContent=error.message;return}$('newEvaluationTitle').value='';qualityAddedId=added?.[0]?.id;$('filter').value='all';$('agentFilter').value='all';$('msg').textContent=`Evaluation added for ${agentName} on ${qualityDayLabel(callDate)}.`;await loadCalls()}
$('newEvaluationDate').value=localDateKey();$('qualityCreateForm').onsubmit=addQualityEvaluation;$('logoutBtn').onclick=async()=>{localStorage.removeItem('newtel-quality-request');localStorage.removeItem('ebookAuthSession');localStorage.removeItem('ebookUser');localStorage.removeItem('ebookPermissions');await db.auth.signOut();location.replace('ebook.html')};$('refreshBtn').onclick=loadCalls;$('filter').onchange=render;$('agentFilter').onchange=render;(async()=>{if(await enterFromEbookSession())return;const {data:{session}}=await db.auth.getSession();if(session){try{await enter(session);return}catch(_error){}}location.replace('ebook.html')})();
