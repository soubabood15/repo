<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCM mobile fixture · local preview</title><link rel="stylesheet" href="../../hr.css"><link rel="stylesheet" href="../../hr-records.css"><script src="../../hr-live-dom.js"></script><style>body{margin:0;background:#edf3f8;color:#18324a;font:14px Arial,sans-serif}.preview{width:390px;max-width:100%;margin:20px auto;padding:14px;box-sizing:border-box}.preview h1{font-size:20px}.preview .hr-grid{display:grid;grid-template-columns:1fr}.preview .hr-card{padding:18px;background:white;border-radius:12px}.preview .hr-details{display:grid;gap:12px;margin:18px 0}.preview .hr-details small{display:block;color:#71869a}.preview button{min-height:44px}</style></head><body><main class="preview"><h1>Mobile preview · fixture data only</h1><p>No real employees, credentials or remote requests.</p><div id="attendance"></div><ucm-performance-loader></ucm-performance-loader></main><script type="module">
import '../../ucm-performance-ui.js';
import {renderAttendanceRecords} from '../../hr-attendance-ui.js';
globalThis.NewtelHrApi={async call(){return {ok:true}}};globalThis.NewtelUcmToken=async()=> 'local-preview-fixture';
globalThis.fetch=async(url)=>{if(!String(url).includes('/integrations/ucm/day?'))throw Error('Network disabled in fixture');const day=new URL(url).searchParams.get('day');return new Response(JSON.stringify({status:'complete',day,source:'ucm_api',as_of:new Date().toISOString(),agents:[{extension:'116',username:'116',full_name:'Fixture Employee',total:3,answered:2,talk:120,wait:30,talk_known:true,wait_known:true,queues:[{queue:'6500',total:3,answered:2,talk:120,wait:30}],hourly:[]}]}),{headers:{'Content-Type':'application/json'}})};
const rows=Array.from({length:30},(_,i)=>{const day='2026-09-'+String(i+1).padStart(2,'0'),present=i%3!==0;return {username:'116',full_name:'Fixture Employee',day,shift:'08:00 - 17:00',status:present?'present':'absent',attendance:present?{punch_in:day+'T05:00:00Z',punch_out:day+'T14:00:00Z'}:null,late_minutes:0,work_minutes:present?540:0,required_minutes:540}});
renderAttendanceRecords(document.getElementById('attendance'),{month:'2026-09',rows,basis:'Fixture records only. Green: checked in. Red: absent.'},{write:true});
</script></body></html>
